<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>子ども関連支出 清算整理</title><link rel="stylesheet" href="styles.css"><style>.child-master{display:flex;gap:7px;align-items:center;margin-left:auto;font-weight:650}.child-master input{width:90px;margin:0}@media(max-width:720px){.child-master{margin-left:0;flex-wrap:wrap}}</style>
</head>
<body>
  <header class="app-header"><div><p class="eyebrow">LOCAL POC · 外部送信なし</p><h1>子ども関連支出 清算整理</h1><p>原本証拠を参照しながら、支出の記録・積算・確認を行います。</p></div><div class="header-actions"><button id="exportCsv" class="secondary">CSV出力</button><button id="showPrint" class="primary">印刷用表示</button></div></header>
  <main>
    <section class="summary-section" aria-label="集計と期間"><div id="summaryCards" class="summary-cards"></div><div class="period-filter"><label>期間 <select id="periodPreset"><option value="all">全期間</option><option value="month">今月</option><option value="custom">任意期間</option></select></label><label class="custom-date">開始日 <input id="dateFrom" type="date"></label><label class="custom-date">終了日 <input id="dateTo" type="date"></label><div class="child-master"><span>対象児童名</span><input id="childName1" aria-label="対象児童1の名称"><input id="childName2" aria-label="対象児童2の名称"><button id="saveChildren" type="button" class="secondary">名称を保存</button></div></div></section>
    <section class="workspace"><div class="section-heading"><div><p class="eyebrow">登録・編集</p><h2 id="formTitle">経費を登録</h2></div><button id="newRecord" class="text-button" type="button">入力をリセット</button></div>
      <form id="expenseForm" novalidate>
        <div class="entry-grid"><section class="evidence-panel"><h3>原本証拠</h3><label class="file-drop" id="dropZone" for="evidenceFile"><input id="evidenceFile" type="file" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"><strong>原本ファイルを選択</strong><span>JPG / JPEG / PNG / PDF（20MBまで）</span><small>またはここへドラッグ＆ドロップ</small></label><p id="fileError" class="field-error" role="alert"></p><div id="preview" class="preview"><p class="empty-preview">原本ファイルを選択するとここに表示されます。</p></div><dl class="file-meta"><div><dt>ファイル名</dt><dd id="fileName">未選択</dd></div><div><dt>ファイル種別</dt><dd id="fileType">—</dd></div><div><dt>証拠番号</dt><dd id="evidenceNumber">登録時に採番</dd></div></dl><p class="subtle">登録済みの原本は、このブラウザ内のIndexedDBに保存します。</p></section>
          <section class="details-panel"><h3>支出内容</h3><div class="fields"><label>支払日 <input name="paidDate" type="date" required></label><label>金額 <input name="amount" type="number" min="0" step="1" inputmode="numeric" placeholder="0" required></label><label>支払先 <input name="vendor" type="text" placeholder="例：○○クリニック"></label><label>対象児童 <select name="childId" id="childSelect"></select></label><label>費目 <select name="category" id="categorySelect"></select></label><label>支払者 <input name="payer" type="text" value="自分"></label><label class="full">対象期間 <input name="targetPeriod" type="text" placeholder="例：2026年4月分 / 2026-04-01〜2026-04-30"></label>
            <fieldset class="full segmented-field"><legend>養育関連区分</legend><div id="parentingSegment" class="segment"><button type="button" data-value="対象">対象</button><button type="button" data-value="対象外">対象外</button><button type="button" data-value="要確認" class="review">要確認</button></div></fieldset><fieldset class="full segmented-field"><legend>特別費区分</legend><div id="specialSegment" class="segment"><button type="button" data-value="該当">該当</button><button type="button" data-value="非該当">非該当</button><button type="button" data-value="要確認" class="review">要確認</button></div></fieldset>
            <label class="full">支出理由 <textarea name="reason" rows="3" placeholder="例：子どもの定期診察および治療のために支出した医療費"></textarea><span class="help">備考とは別に、支出の目的・事情を記載します。</span></label>
            <div class="rate-row full"><label>自分負担率 <input name="selfBurdenRate" type="number" min="0" max="100" step="1" value="50">%</label><label>相手負担率 <input name="otherBurdenRate" type="number" min="0" max="100" step="1" value="50">%</label><span id="rateMessage" class="help"></span></div>
            <label>既払い額 <input name="alreadyPaidAmount" type="number" min="0" step="1" value="0"></label><label>相手負担想定額 <output id="otherBurdenAmount">¥0</output></label><label>未清算額 <output id="outstandingAmount">¥0</output></label><fieldset class="segmented-field"><legend>清算状態</legend><select name="settlementStatus" id="settlementStatus"></select></fieldset><label class="full">備考 <textarea name="notes" rows="2"></textarea></label>
          </div><div class="form-actions"><button type="submit" class="primary">登録する</button><button id="cancelEdit" type="button" class="secondary" hidden>編集を中止</button></div><p id="formMessage" class="form-message" role="status"></p></section>
        </div>
      </form>
    </section>
    <section class="records-section"><div class="section-heading"><div><p class="eyebrow">登録済み経費</p><h2>明細一覧</h2></div><div class="filters"><select id="filterChild"><option value="">対象児童：すべて</option></select><select id="filterCategory"><option value="">費目：すべて</option></select><select id="filterParenting"><option value="">養育関連：すべて</option></select><select id="filterSettlement"><option value="">状態：すべて</option></select></div></div><div class="table-wrap"><table><thead><tr><th>証拠番号</th><th><button class="sort" data-sort="paidDate">支払日 ↕</button></th><th>対象児童</th><th>費目</th><th>支払先</th><th>金額</th><th>相手負担額</th><th>既払い</th><th>未清算</th><th>区分</th><th>状態</th><th>操作</th></tr></thead><tbody id="recordsBody"></tbody></table></div></section>
  </main><dialog id="detailDialog"><div id="detailContent"></div><form method="dialog"><button class="secondary">閉じる</button></form></dialog><div id="printView" class="print-view" hidden><div class="print-toolbar"><button id="executePrint" class="primary">この内容を印刷</button><button id="closePrint" class="secondary">戻る</button></div><div id="printContent"></div></div><script src="./node_modules/xlsx/dist/xlsx.full.min.js"></script><script src="./node_modules/docx/dist/index.iife.js"></script><script src="./node_modules/tesseract.js/dist/tesseract.min.js"></script><script type="module" src="app.js"></script><script type="module" src="phase2.js"></script>
</body>
</html>
